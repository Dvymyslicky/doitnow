<style>
  :root{
    --bg:#0f1115;
    --bg2:#171a21;
    --card:#1c2029;
    --card2:#232834;
    --line:#2c3240;
    --txt:#eef1f6;
    --muted:#8a91a0;
    --accent:#ff6b35;
    --accent2:#ffb142;
    --green:#22c98a;
    --blue:#4f8cff;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--txt);
    min-height:100vh;
    padding-bottom:88px;
    overscroll-behavior-y:none;
  }
  .app{max-width:520px;margin:0 auto;padding:0 16px}
  header{
    padding:calc(env(safe-area-inset-top) + 18px) 0 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-size:22px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .pill{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center
  }
  .pill b{color:var(--txt)}

  /* Views */
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 2px 10px}

  /* ---------- Exercise carousel ---------- */
  .carousel{
    display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:6px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .carousel::-webkit-scrollbar{display:none}
  .slide{
    flex:0 0 80%;scroll-snap-align:center;
    border-radius:24px;border:1.5px solid var(--line);
    background:linear-gradient(160deg,var(--card2),var(--card));
    padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    transition:transform .3s ease, opacity .3s ease, border-color .3s ease, box-shadow .3s ease;
    transform:scale(.9);opacity:.5;box-shadow:var(--shadow)
  }
  .slide.active{transform:scale(1);opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 12px 30px rgba(255,107,53,.18)}
  .slide .emoji{font-size:56px;line-height:1}
  .slide .name{font-weight:700;font-size:19px}
  .slide .meta{font-size:12px;color:var(--muted)}
  .slide .badge{font-size:11px;color:var(--accent2);background:rgba(255,177,66,.12);padding:3px 10px;border-radius:999px}

  .dots{display:flex;justify-content:center;gap:7px;margin:4px 0 16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .dot.active{background:var(--accent);width:20px;border-radius:4px}

  /* ---------- Horizontal ruler picker ---------- */
  .ruler-card{padding:18px 0 16px;overflow:hidden}
  .ruler-label{text-align:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .ruler-value{text-align:center;font-weight:800;font-size:60px;line-height:1;font-variant-numeric:tabular-nums;transition:transform .08s ease}
  .ruler-value.pop{transform:scale(1.12)}
  .ruler-value small{font-size:15px;color:var(--muted);font-weight:600;margin-left:6px}
  .ruler{position:relative;height:78px;margin-top:10px;touch-action:none;cursor:grab;user-select:none}
  .ruler:active{cursor:grabbing}
  .ruler-fade-l,.ruler-fade-r{position:absolute;top:0;bottom:0;width:64px;z-index:3;pointer-events:none}
  .ruler-fade-l{left:0;background:linear-gradient(90deg,var(--card),transparent)}
  .ruler-fade-r{right:0;background:linear-gradient(270deg,var(--card),transparent)}
  .ruler-pointer{position:absolute;left:50%;top:6px;bottom:18px;width:3px;margin-left:-1.5px;background:var(--accent);z-index:4;border-radius:2px;box-shadow:0 0 8px rgba(255,107,53,.6)}
  .ruler-pointer::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--accent)}
  .ruler-track{position:absolute;top:8px;height:46px;left:0;will-change:transform}
  .tick{position:absolute;bottom:0;width:2px;background:var(--line);border-radius:2px}
  .tick.minor{height:16px}
  .tick.major{height:30px;background:var(--muted)}
  .tick-num{position:absolute;bottom:32px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}

  .kcal-live{text-align:center;margin-top:14px;font-size:14px;color:var(--muted)}
  .kcal-live b{color:var(--accent2);font-size:18px}

  .btn{
    width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1205;transition:.15s;box-shadow:var(--shadow)
  }
  .btn:active{transform:scale(.98);filter:brightness(1.05)}
  .btn:disabled{opacity:.4;filter:grayscale(.5)}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.danger{background:var(--card2);color:#ff6b6b;border:1px solid var(--line)}

  /* Today list */
  .stat-row{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
  .stat .big{font-size:26px;font-weight:800}
  .stat .big.accent{color:var(--accent2)}
  .stat .big.green{color:var(--green)}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

  .log-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
  .log-item .emoji{font-size:22px}
  .log-item .info{flex:1;min-width:0}
  .log-item .info .t{font-weight:600;font-size:14.5px}
  .log-item .info .s{font-size:12px;color:var(--muted)}
  .log-item .kcal{font-weight:700;color:var(--accent2);font-size:14px;white-space:nowrap}
  .log-item .del{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .empty .big{font-size:40px;display:block;margin-bottom:8px}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head button{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
  .cal-head .mlabel{font-weight:700;font-size:16px;text-transform:capitalize}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
  .cal-day{
    aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.12s
  }
  .cal-day.empty{background:transparent;border:none;cursor:default}
  .cal-day .dn{font-size:13px;font-weight:600}
  .cal-day .dk{font-size:9px;color:var(--accent2);font-weight:700;margin-top:1px}
  .cal-day.today{border-color:var(--blue)}
  .cal-day.has{background:linear-gradient(145deg,#1a2620,#1c2029)}
  .cal-day.sel{box-shadow:0 0 0 2px var(--accent) inset;border-color:var(--accent)}
  .heat1{box-shadow:0 0 0 1px rgba(34,201,138,.3) inset}
  .heat2{box-shadow:0 0 0 1px rgba(34,201,138,.6) inset}
  .heat3{box-shadow:0 0 0 2px rgba(34,201,138,.9) inset}

  /* Settings */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{
    width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:13px;font-size:16px
  }
  .met-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .met-row:last-child{border-bottom:none}
  .met-row .emoji{font-size:20px}
  .met-row .nm{flex:1;font-size:14px}
  .met-row input{width:64px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px;text-align:center;font-size:15px}
  .met-row .unit{font-size:11px;color:var(--muted);width:34px}
  .met-row .del{background:none;border:none;color:#ff6b6b;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1}

  /* Tabbar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(15,17,21,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);
    display:flex;justify-content:space-around;
  }
  .tab{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10.5px;padding:4px 14px;transition:.15s}
  .tab .ico{font-size:22px}
  .tab.active{color:var(--accent)}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#06231a;padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;justify-content:center}
  .modal-bd.show{display:flex}
  .modal{background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;width:100%;max-width:520px;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:80vh;overflow:auto;animation:slideup .25s ease}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal h3{margin:0 0 4px}
  .modal .dt{color:var(--muted);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Do<span>It</span>Now</h1>
    <div class="pill">🔥 dnes <b id="todayKcalPill">0</b> kcal</div>
  </header>

  <!-- ADD -->
  <section class="view active" id="view-add">

    <div class="card ruler-card">

  <!-- TODAY -->

  <!-- CALENDAR -->
  <section class="view" id="view-cal">

      <div class="cal-head">
        <button id="prevM">‹</button>
        <div class="mlabel" id="mLabel"></div>
        <button id="nextM">›</button>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:5px"></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="big accent" id="mKcal">0</div><div class="lbl">kcal / mesiac</div></div>
      <div class="stat"><div class="big green" id="mDays">0</div><div class="lbl">aktívnych dní</div></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="view-set">
    <div class="card">
      <div class="section-title">Profil</div>

    </div>
    <div class="card">
      <div class="section-title">MET hodnoty cvikov</div>

      <p style="font-size:11.5px;color:var(--muted);margin:12px 2px 0;line-height:1.5">
        Kalórie = MET × váha(kg) × čas(h). Čas sa odhaduje z počtu opakovaní podľa tempa cviku (~3 s/opak.).
      </p>
    </div>
    <div class="card">
      <div class="section-title">Pridať vlastný cvik</div>

      </div>
      <div class="field">
        <label>Emoji</label>
        <input type="text" id="nxEmoji" placeholder="🏋️" maxlength="4">

      <label style="display:flex;align-items:center;gap:10px;font-size:14px;margin:2px 2px 14px;color:var(--txt)">

<script>
"use strict";
/* ---------------- Config / defaults ---------------- */
const DEFAULT_EXERCISES = [
  { id:"diamond",  name:"Diamond push ups", emoji:"💎", met:8.0, secPerRep:3, perArm:false },
  { id:"pike",     name:"Pike push ups",    emoji:"🔺", met:8.0, secPerRep:3, perArm:false },
  { id:"biceps",   name:"Biceps s gumou",   emoji:"💪", met:4.0, secPerRep:3, perArm:true  },
  { id:"triceps",  name:"Triceps s gumou",  emoji:"🦾", met:4.0, secPerRep:3, perArm:false },
];
const STORE_KEY = "doitnow.v1";
const RULER_MIN = 1, RULER_MAX = 300, SPACING = 16;

/* ---------------- State ---------------- */
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s = JSON.parse(raw); return migrate(s); }
  }catch(e){}
  return { weight:90, exercises:DEFAULT_EXERCISES, logs:[], lastReps:{} };
}
function migrate(s){
  s.weight = s.weight || 90;
  s.logs = s.logs || [];
  s.lastReps = s.lastReps || {};
  let list = Array.isArray(s.exercises) ? s.exercises.slice() : [];
  // ensure the built-in exercises always exist (backfill any missing fields)
  DEFAULT_EXERCISES.forEach(def=>{
    const found = list.find(e=>e.id===def.id);
    if(!found){ list.push({...def}); }
    else{
      found.name     = found.name     ?? def.name;
      found.emoji    = found.emoji    ?? def.emoji;
      found.met      = found.met      ?? def.met;
      found.secPerRep= found.secPerRep?? def.secPerRep;
      found.perArm   = found.perArm   ?? def.perArm;
    }
  });
  s.exercises = list;
  return s;
}
const DEFAULT_IDS = DEFAULT_EXERCISES.map(e=>e.id);
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ---------------- Helpers ---------------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const pad = n => String(n).padStart(2,"0");
function dayKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayKey(){ return dayKey(new Date()); }
function exById(id){ return state.exercises.find(e=>e.id===id); }
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function kcalFor(ex, reps){
  const totalReps = ex.perArm ? reps*2 : reps;
  const hours = (totalReps * ex.secPerRep) / 3600;
  return ex.met * state.weight * hours;
}
function fmt(n){ return Math.round(n); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* ---------------- Navigation ---------------- */
$$(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    const v = tab.dataset.view;
    $$(".tab").forEach(t=>t.classList.toggle("active", t===tab));
    $$(".view").forEach(s=>s.classList.toggle("active", s.id==="view-"+v));
    if(v==="today") renderToday();
    if(v==="cal") renderCalendar();
    if(v==="set") renderSettings();
  });
});

/* ---------------- ADD: exercise carousel ---------------- */
let selectedIdx = 0;
let count = 10;

function renderCarousel(){
  const car = $("#carousel"); car.innerHTML = "";
  const dots = $("#dots"); dots.innerHTML = "";
  state.exercises.forEach((ex,i)=>{
    const s = document.createElement("div");
    s.className = "slide";
    s.dataset.idx = i;
    s.innerHTML = `<div class="emoji">${ex.emoji}</div>
      <div class="name">${ex.name}</div>
      <div class="meta">MET ${ex.met} · ~${ex.secPerRep}s / opak.</div>
      ${ex.perArm?'<div class="badge">na každú ruku</div>':''}`;
    car.appendChild(s);
    const d = document.createElement("div");
    d.className = "dot";
    dots.appendChild(d);
  });
  updateActiveSlide();
}

function updateActiveSlide(){
  const car = $("#carousel");
  const center = car.scrollLeft + car.clientWidth/2;
  let best = 0, bestDist = Infinity;
  $$(".slide").forEach((s,i)=>{
    const sc = s.offsetLeft + s.offsetWidth/2;
    const dist = Math.abs(sc - center);
    if(dist < bestDist){ bestDist = dist; best = i; }
  });
  const changed = best !== selectedIdx;
  if(changed){ selectedIdx = best; buzz(6); }
  $$(".slide").forEach((s,i)=>s.classList.toggle("active", i===selectedIdx));
  $$(".dot").forEach((d,i)=>d.classList.toggle("active", i===selectedIdx));
  const ex = state.exercises[selectedIdx];
  $("#repLbl").textContent = ex.perArm ? "Opakovaní na každú ruku" : "Počet opakovaní";
  $("#repUnit").textContent = ex.perArm ? "× / ruka" : "×";
  if(changed){
    // prefill ruler with the reps from the last logged set of this exercise
    setRulerValue(state.lastReps[ex.id] || 10, true);
  } else {
    updateKcal();
  }
}
let scrollT;
$("#carousel").addEventListener("scroll",()=>{
  cancelAnimationFrame(scrollT);
  scrollT = requestAnimationFrame(updateActiveSlide);
});

/* ---------------- ADD: horizontal ruler picker ---------------- */
function buildRuler(){
  const track = $("#rulerTrack");
  track.innerHTML = "";
  for(let v=RULER_MIN; v<=RULER_MAX; v++){
    const t = document.createElement("div");
    const major = v % 5 === 0;
    t.className = "tick " + (major?"major":"minor");
    t.style.left = (v*SPACING) + "px";
    track.appendChild(t);
    if(v % 10 === 0){
      const n = document.createElement("div");
      n.className = "tick-num";
      n.style.left = (v*SPACING) + "px";
      n.textContent = v;
      track.appendChild(n);
    }
  }
}
function valueToTranslate(v){
  const ruler = $("#ruler");
  return ruler.clientWidth/2 - v*SPACING;
}
function setRulerValue(v, animate){
  v = Math.min(RULER_MAX, Math.max(RULER_MIN, Math.round(v)));
  count = v;
  const track = $("#rulerTrack");
  track.style.transition = animate ? "transform .25s cubic-bezier(.22,1.2,.4,1)" : "none";
  track.style.transform = "translateX(" + valueToTranslate(v) + "px)";
  $("#rulerValue").childNodes[0].nodeValue = v;
  updateKcal();
}
function updateKcal(){
  const ex = state.exercises[selectedIdx];
  if(ex) $("#liveKcal").textContent = fmt(kcalFor(ex, count));
}

(function initRulerDrag(){
  const ruler = $("#ruler");
  const track = $("#rulerTrack");
  const valEl = $("#rulerValue");
  let dragging=false, startX=0, startTx=0, lastV=count;

  function curTranslate(){
    const m = /translateX\(([-0-9.]+)px\)/.exec(track.style.transform);
    return m ? parseFloat(m[1]) : valueToTranslate(count);
  }
  function pointer(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

  function down(e){
    dragging=true; startX=pointer(e); startTx=curTranslate();
    track.style.transition="none";
    lastV=count;
  }
  function move(e){
    if(!dragging) return;
    e.preventDefault();
    const dx = pointer(e) - startX;
    let tx = startTx + dx;
    // live value from translate (free drag)
    let v = Math.round((ruler.clientWidth/2 - tx)/SPACING);
    v = Math.min(RULER_MAX, Math.max(RULER_MIN, v));
    track.style.transform = "translateX(" + tx + "px)";
    if(v !== lastV){
      lastV = v; count = v;
      valEl.childNodes[0].nodeValue = v;
      valEl.classList.add("pop"); setTimeout(()=>valEl.classList.remove("pop"),80);
      buzz(7); // mechanical notch
      updateKcal();
    }
  }
  function up(){
    if(!dragging) return;
    dragging=false;
    setRulerValue(count, true); // snap to exact tick
  }
  ruler.addEventListener("mousedown",down);
  window.addEventListener("mousemove",move);
  window.addEventListener("mouseup",up);
  ruler.addEventListener("touchstart",down,{passive:false});
  ruler.addEventListener("touchmove",move,{passive:false});
  ruler.addEventListener("touchend",up);
})();

$("#saveBtn").addEventListener("click",()=>{
  const ex = state.exercises[selectedIdx];
  if(!ex) return;
  const entry = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
    exId: ex.id,
    reps: count,
    kcal: kcalFor(ex, count),
    ts: new Date().toISOString()
  };
  state.logs.push(entry);
  state.lastReps[ex.id] = count; // remember reps for next time on this exercise
  save();
  buzz([10,40,10]);
  toast("Zapísané! +"+fmt(entry.kcal)+" kcal 🔥");
  updateTodayPill();
});

/* ---------------- TODAY view ---------------- */
function logsForDay(key){ return state.logs.filter(l=>l.ts.slice(0,10)===key).sort((a,b)=>b.ts.localeCompare(a.ts)); }

function updateTodayPill(){
  const logs = logsForDay(todayKey());
  $("#todayKcalPill").textContent = fmt(logs.reduce((s,l)=>s+l.kcal,0));
}
function renderToday(){
  const logs = logsForDay(todayKey());
  const kcal = logs.reduce((s,l)=>s+l.kcal,0);
  const reps = logs.reduce((s,l)=>{ const e=exById(l.exId); return s + (e&&e.perArm? l.reps*2 : l.reps); },0);
  $("#tKcal").textContent = fmt(kcal);
  $("#tReps").textContent = reps;
  $("#tSets").textContent = logs.length;
  const list = $("#todayList");
  if(!logs.length){ list.innerHTML = `<div class="empty"><span class="big">🛋️</span>Dnes ešte nič. Šup do toho!</div>`; return; }
  list.innerHTML = "";
  logs.forEach(l=>{
    const ex = exById(l.exId) || {name:"?",emoji:"❓",perArm:false};
    const time = new Date(l.ts).toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"});
    const repTxt = ex.perArm ? `${l.reps}× / ruka` : `${l.reps}× opak.`;
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `<span class="emoji">${ex.emoji}</span>
      <div class="info"><div class="t">${ex.name}</div><div class="s">${repTxt} · ${time}</div></div>
      <span class="kcal">${fmt(l.kcal)} kcal</span>
      <button class="del" title="Zmazať">✕</button>`;
    item.querySelector(".del").addEventListener("click",()=>{
      state.logs = state.logs.filter(x=>x.id!==l.id);
      save(); renderToday(); updateTodayPill();
    });
    list.appendChild(item);
  });
}

/* ---------------- CALENDAR view ---------------- */
let calRef = new Date(); calRef.setDate(1);
let selDay = null;

function dayTotals(key){
  const logs = logsForDay(key);
  return { kcal: logs.reduce((s,l)=>s+l.kcal,0), sets: logs.length };
}
function renderCalendar(){
  const dow = ["Po","Ut","St","Št","Pi","So","Ne"];
  $("#calDow").innerHTML = dow.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  $("#mLabel").textContent = calRef.toLocaleDateString("sk-SK",{month:"long",year:"numeric"});

  const year = calRef.getFullYear(), month = calRef.getMonth();
  const first = new Date(year, month, 1);
  let startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const grid = $("#calGrid"); grid.innerHTML = "";
  for(let i=0;i<startDow;i++){ const e=document.createElement("div"); e.className="cal-day empty"; grid.appendChild(e); }

  let monthKcal = 0, activeDays = 0;
  const tk = todayKey();
  for(let d=1; d<=daysInMonth; d++){
    const dd = new Date(year, month, d);
    const key = dayKey(dd);
    const tot = dayTotals(key);
    if(tot.kcal>0){ monthKcal += tot.kcal; activeDays++; }
    const cell = document.createElement("div");
    let heat = tot.kcal>0 ? (tot.kcal>150?"heat3":tot.kcal>70?"heat2":"heat1") : "";
    cell.className = "cal-day "+heat + (tot.sets?" has":"") + (key===tk?" today":"") + (key===selDay?" sel":"");
    cell.innerHTML = `<div class="dn">${d}</div>` + (tot.kcal>0?`<div class="dk">${fmt(tot.kcal)}</div>`:"");
    cell.addEventListener("click",()=>{ selDay=key; renderCalendar(); openDay(key); });
    grid.appendChild(cell);
  }
  $("#mKcal").textContent = fmt(monthKcal);
  $("#mDays").textContent = activeDays;
}
$("#prevM").addEventListener("click",()=>{ calRef.setMonth(calRef.getMonth()-1); renderCalendar(); });
$("#nextM").addEventListener("click",()=>{ calRef.setMonth(calRef.getMonth()+1); renderCalendar(); });

function openDay(key){
  const logs = logsForDay(key);
  const d = new Date(key+"T00:00:00");
  $("#dmTitle").textContent = d.toLocaleDateString("sk-SK",{weekday:"long",day:"numeric",month:"long"});
  const agg = {}; let totK = 0;
  logs.forEach(l=>{
    const ex = exById(l.exId) || {name:"?",emoji:"❓",perArm:false};
    if(!agg[l.exId]) agg[l.exId] = {ex, reps:0, kcal:0, sets:0};
    agg[l.exId].reps += ex.perArm ? l.reps*2 : l.reps;
    agg[l.exId].kcal += l.kcal; agg[l.exId].sets++;
    totK += l.kcal;
  });
  $("#dmSub").textContent = logs.length ? `Spolu ${fmt(totK)} kcal · ${logs.length} setov` : "Žiadny tréning";
  const list = $("#dmList");
  if(!logs.length){ list.innerHTML = `<div class="empty"><span class="big">😴</span>V tento deň žiadny tréning.</div>`; }
  else{
    list.innerHTML = "";
    Object.values(agg).sort((a,b)=>b.kcal-a.kcal).forEach(a=>{
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `<span class="emoji">${a.ex.emoji}</span>
        <div class="info"><div class="t">${a.ex.name}</div><div class="s">${a.reps}× opak. · ${a.sets} ${a.sets===1?"set":"sety"}</div></div>
        <span class="kcal">${fmt(a.kcal)} kcal</span>`;
      list.appendChild(item);
    });
  }
  $("#dayModal").classList.add("show");
}
$("#dayModal").addEventListener("click",e=>{ if(e.target.id==="dayModal") $("#dayModal").classList.remove("show"); });

/* ---------------- SETTINGS view ---------------- */
function renderSettings(){
  $("#weightInput").value = state.weight;
  const ml = $("#metList"); ml.innerHTML = "";
  state.exercises.forEach(ex=>{
    const custom = !DEFAULT_IDS.includes(ex.id);
    const row = document.createElement("div");
    row.className = "met-row";
    row.innerHTML = `<span class="emoji">${ex.emoji}</span>
      <span class="nm">${ex.name}</span>
      <input type="number" step="0.1" value="${ex.met}" data-id="${ex.id}">
      <span class="unit">MET</span>
      ${custom?'<button class="del" title="Zmazať cvik">✕</button>':''}`;
    row.querySelector("input").addEventListener("change",e=>{
      const v = parseFloat(e.target.value);
      if(!isNaN(v) && v>0){ ex.met = v; save(); updateTodayPill(); renderCarousel(); toast("Uložené"); }
    });
    if(custom){
      row.querySelector(".del").addEventListener("click",()=>{
        if(confirm(`Zmazať cvik „${ex.name}"? Záznamy v histórii ostanú zachované.`)){
          state.exercises = state.exercises.filter(x=>x.id!==ex.id);
          if(selectedIdx >= state.exercises.length) selectedIdx = 0;
          save(); renderSettings(); renderCarousel(); toast("Cvik zmazaný");
        }
      });
    }
    ml.appendChild(row);
  });
}
$("#addExBtn").addEventListener("click",()=>{
  const name = $("#nxName").value.trim();
  const emoji = $("#nxEmoji").value.trim() || "🏋️";
  const met = parseFloat($("#nxMet").value);
  const sec = parseFloat($("#nxSec").value) || 3;
  const perArm = $("#nxArm").checked;
  if(!name){ toast("Zadaj názov cviku"); return; }
  if(isNaN(met) || met<=0){ toast("Zadaj platnú MET hodnotu"); return; }
  state.exercises.push({
    id: "custom-"+Date.now().toString(36),
    name, emoji, met, secPerRep: sec, perArm
  });
  save();
  $("#nxName").value=""; $("#nxEmoji").value=""; $("#nxMet").value=""; $("#nxSec").value=""; $("#nxArm").checked=false;
  renderSettings(); renderCarousel();
  buzz([10,40,10]);
  toast("Cvik pridaný ✅");
});
$("#weightInput").addEventListener("change",e=>{
  const v = parseFloat(e.target.value);
  if(!isNaN(v) && v>0){ state.weight = v; save(); updateTodayPill(); updateKcal(); toast("Váha uložená"); }
});
$("#exportBtn").addEventListener("click",()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "doitnow-zaloha-"+todayKey()+".json";
  a.click(); URL.revokeObjectURL(url);
});
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      state = migrate(s); save();
      renderCarousel(); renderSettings(); updateTodayPill();
      toast("Záloha načítaná ✅");
    }catch(err){ toast("Chyba pri načítaní"); }
  };
  r.readAsText(file);
});
$("#resetBtn").addEventListener("click",()=>{
  if(confirm("Naozaj vymazať všetky dáta? Toto sa nedá vrátiť.")){
    localStorage.removeItem(STORE_KEY);
    state = load();
    renderCarousel(); renderSettings(); updateTodayPill();
    toast("Vymazané");
  }
});

/* ---------------- Init ---------------- */
renderCarousel();
buildRuler();
const startReps = state.lastReps[state.exercises[selectedIdx].id] || 10;
window.addEventListener("load",()=>{ setRulerValue(startReps,false); });
setRulerValue(startReps,false);
updateTodayPill();
window.addEventListener("resize",()=>setRulerValue(count,false));
</script>
